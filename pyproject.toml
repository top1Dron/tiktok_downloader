[tool.poetry]
name = "tiktok-downloader"
version = "0.1.0"
description = "TikTok video downloader with Android app"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "downloaders"}]

[tool.poetry.dependencies]
python = "^3.13"
yt-dlp = "^2024.1.0"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
requests = "^2.31.0"
python-multipart = "^0.0.6"
python-dotenv = "^1.0.0"
asgiref = "^3.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
black = "^23.12.1"
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

